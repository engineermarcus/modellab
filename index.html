<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Model Lab</title>
<style>
body{margin:0;font:15px system-ui,sans-serif;background:#111;color:#eee}
header{padding:10px;position:sticky;top:0;background:#111;z-index:5;border-bottom:1px solid #333}
button,select,label.b,a.b{background:#222;color:#6cf;border:1px solid #444;border-radius:6px;padding:8px 10px;margin:2px;font:inherit;text-decoration:none;display:inline-block}
.card{margin:12px 8px;border:1px solid #333;border-radius:8px;overflow:hidden}
.card h4{margin:0;padding:8px;font-size:14px;word-break:break-all}
.v{height:42vh;background:#222}
canvas{width:100%;height:100%;display:block}
.bar{padding:6px}
pre{white-space:pre-wrap;font-size:12px;color:#9c9;margin:6px}
</style>
<header><label class=b>Add files<input id=f type=file multiple accept=".glb,.fbx" hidden></label> <input id=q placeholder="search" style="background:#222;color:#eee;border:1px solid #444;border-radius:6px;padding:8px;margin:2px;width:35%"> <span id=st></span></header>
<div id=list></div>
<script type=importmap>{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type=module>
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {Client} from 'https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js'\;
const SPACE='marx21/cortex-lexicon';
const $=s=>document.querySelector(s);
const status=t=>$('#st').textContent=t;
let client;const getClient=async()=>client||(client=await Client.connect(SPACE));
const load={
  glb:u=>new GLTFLoader().loadAsync(u).then(g=>({obj:g.scene,clips:g.animations})),
  fbx:u=>new FBXLoader().loadAsync(u).then(o=>({obj:o,clips:o.animations}))
};
function viewer(host,url,ext,bar,pre){
  let r,scene,cam,ctl,mixer,raf,data,on=false,act;
  const clock=new THREE.Clock();
  const sel=document.createElement('select');
  sel.onchange=()=>play();
  bar.append(sel);
  function play(){
    if(!mixer||!data)return;
    if(act)act.stop();
    const c=data.clips[sel.value];
    if(c){act=mixer.clipAction(c);act.reset().play()}
  }
  async function start(){
    if(on)return;on=true;
    try{
      const c=document.createElement('canvas');host.replaceChildren(c);
      r=new THREE.WebGLRenderer({canvas:c,antialias:true});
      r.setPixelRatio(Math.min(devicePixelRatio,2));
      const w=host.clientWidth,h=host.clientHeight;r.setSize(w,h,false);
      scene=new THREE.Scene();scene.background=new THREE.Color(0x222222);
      scene.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),0.04).texture;
      cam=new THREE.PerspectiveCamera(45,w/h,0.01,100);cam.position.set(0,0.5,2.2);
      ctl=new OrbitControls(cam,c);c.style.touchAction='pan-y';ctl.autoRotate=true;
      if(!data){
        data=await load[ext](url);
        const m=data.obj;
        let b=new THREE.Box3().setFromObject(m),s=b.getSize(new THREE.Vector3());
        m.scale.multiplyScalar(1/(Math.max(s.x,s.y,s.z)||1));
        m.updateMatrixWorld(true);
        b=new THREE.Box3().setFromObject(m);m.position.sub(b.getCenter(new THREE.Vector3()));
        sel.innerHTML='<option value="-1">no animation</option>'+data.clips.map((a,i)=>`<option value=${i}>${a.name||'clip '+i} (${a.duration.toFixed(1)}s)</option>`).join('');
        if(data.clips.length)sel.value=0;
        pre.textContent=data.clips.length+' animation(s)';
      }
      scene.add(data.obj);
      mixer=new THREE.AnimationMixer(data.obj);play();
      const loop=()=>{raf=requestAnimationFrame(loop);mixer.update(clock.getDelta());ctl.update();r.render(scene,cam)};loop();
    }catch(e){pre.textContent='viewer error: '+(e.message||e);on=false}
  }
  function stop(){
    if(!on)return;on=false;cancelAnimationFrame(raf);
    if(scene&&data)scene.remove(data.obj);
    ctl&&ctl.dispose();r&&(r.dispose(),r.forceContextLoss());host.replaceChildren();mixer=null;act=null;
  }
  new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?start():stop()),{rootMargin:'150px'}).observe(host);
}
function addCard(name,url,file,log){
  const ext=name.split('.').pop().toLowerCase();
  const el=document.createElement('div');el.className='card';
  el.innerHTML='<h4></h4><div class=v></div><div class=bar></div><pre></pre>';
  el.querySelector('h4').textContent=name;
  const host=el.querySelector('.v'),bar=el.querySelector('.bar'),pre=el.querySelector('pre');
  if(log)pre.textContent=log;
  $('#list').prepend(el);
  const dl=document.createElement('a');dl.className='b';dl.href=url;dl.download=name;dl.textContent='Download';bar.append(dl);
  if(ext==='glb'){
    const b=document.createElement('button');b.textContent='Convert → FBX';
    b.onclick=async()=>{
      b.disabled=true;status('converting '+name+' (first call may wake the Space)…');
      try{
        const app=await getClient();
        const fl=file||new File([await (await fetch(url)).blob()],name);const res=await app.predict('/convert',[fl]);
        const f=res.data[0];
        const bl=await (await fetch(f.url)).blob();
        addCard(name.replace(/\.glb$/i,'.fbx'),URL.createObjectURL(bl),null,res.data[1]);
        status('done');
      }catch(e){status('error');pre.textContent='convert error: '+(e&&e.message||JSON.stringify(e))}
      b.disabled=false;
    };
    bar.append(b);
  }
  viewer(host,url,ext,bar,pre);
}
$('#f').onchange=e=>{for(const f of e.target.files)addCard(f.name,URL.createObjectURL(f),f);e.target.value=''};
$('#q').oninput=e=>{const t=e.target.value.toLowerCase();document.querySelectorAll('.card').forEach(c=>c.style.display=c.querySelector('h4').textContent.toLowerCase().includes(t)?'':'none')};
try{const m=await (await fetch('manifest.json')).json();status(m.length+' models');for(const x of m.slice().reverse())addCard(x.name,'assets/'+encodeURIComponent(x.name),null,(x.size/1e6).toFixed(1)+' MB')}catch(e){status('no manifest')}
</script>
